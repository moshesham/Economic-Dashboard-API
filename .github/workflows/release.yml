# Release Workflow
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code with tags (policy-compliant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --prune origin
          git checkout -qf "${GITHUB_SHA}"

      - name: Generate changelog (policy-compliant)
        id: changelog
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)"

          {
            echo "## Changes in ${CURRENT_TAG}"
            echo
            if [ -n "${PREV_TAG}" ]; then
              git log --pretty=format:'- %s (%h)' "${PREV_TAG}..${CURRENT_TAG}"
            else
              git log --pretty=format:'- %s (%h)' -n 50
            fi
          } > RELEASE_NOTES.md

      - name: Create GitHub Release (policy-compliant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if echo "${GITHUB_REF_NAME}" | grep -Eq '(alpha|beta|rc)'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md ${PRERELEASE_FLAG} || \
          gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md ${PRERELEASE_FLAG}

  # ============================================================================
  # Build and Push Release Images
  # ============================================================================
  docker-release:
    name: Docker Release Images
    runs-on: ubuntu-latest
    needs: release
    
    steps:
      - name: Checkout code (policy-compliant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -qf FETCH_HEAD

      - name: Prepare image name (lowercase for Docker)
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx (policy-compliant)
        run: |
          docker buildx create --name release-builder --driver docker-container --use || docker buildx use release-builder
          docker buildx inspect --bootstrap
      
      - name: Log in to Container Registry (policy-compliant)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
      
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Build and push API image (policy-compliant)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.VERSION }}" \
            --tag "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest" \
            .
      
      - name: Create release summary
        run: |
          echo "## 🎉 Release ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest\`" >> $GITHUB_STEP_SUMMARY
