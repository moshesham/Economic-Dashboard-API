name: CD - Docker Build and Push

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements*.txt'
      - 'api/**'
      - 'modules/**'
      - 'services/**'
      - 'core/**'
      - 'app.py'
      - 'worker.py'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code (policy-compliant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -qf FETCH_HEAD

      - name: Prepare image names
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name ci-builder --driver docker-container --use || docker buildx use ci-builder
          docker buildx inspect --bootstrap

      - name: Log in to Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Build and push API image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
          SHA_TAG="${IMAGE}:sha-${{ steps.image.outputs.sha }}"
          LATEST_TAG="${IMAGE}:latest"

          docker buildx build \
            --platform linux/amd64 \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${SHA_TAG}" \
            --tag "${LATEST_TAG}" \
            .

      - name: Build and push Worker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-worker"
          SHA_TAG="${IMAGE}:sha-${{ steps.image.outputs.sha }}"
          LATEST_TAG="${IMAGE}:latest"

          docker buildx build \
            --platform linux/amd64 \
            --target production \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${SHA_TAG}" \
            --tag "${LATEST_TAG}" \
            .

      - name: Deployment summary
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
          echo "## Docker Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${IMAGE_BASE}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: ${IMAGE_BASE}-worker:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
