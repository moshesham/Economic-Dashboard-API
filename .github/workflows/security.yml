# Security Scanning Workflow
name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  # ============================================================================
  # Dependency Vulnerability Scan
  # ============================================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code (policy-compliant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -qf FETCH_HEAD

      - name: Prepare Python runtime (policy-compliant)
        run: |
          python3 --version
          python3 -m pip install --upgrade pip
      
      - name: Install safety
        run: pip install safety pip-audit
      
      - name: Run pip-audit
        run: |
          pip install -r requirements.txt
          pip-audit --desc --format json --output pip-audit-results.json || true
          if [ -f pip-audit-results.json ]; then
            cat pip-audit-results.json
          else
            echo "{}" > pip-audit-results.json
          fi
        continue-on-error: true
      
      - name: Dependency scan summary
        if: always()
        run: |
          echo "### Dependency Scan Output" >> $GITHUB_STEP_SUMMARY
          if [ -f pip-audit-results.json ]; then
            echo "pip-audit-results.json generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "pip-audit-results.json missing" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Static Code Security Analysis
  # ============================================================================
  static-security-analysis:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code (policy-compliant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -qf FETCH_HEAD

      - name: Install and run Bandit
        run: |
          python3 -m pip install --upgrade pip
          pip install bandit[toml]
          bandit -r api modules services -f txt -o bandit-static.txt || true

      - name: Static scan summary
        if: always()
        run: |
          echo "### Static Security Analysis" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-static.txt ]; then
            tail -n 40 bandit-static.txt >> $GITHUB_STEP_SUMMARY || true
          fi

  # ============================================================================
  # Container Security Scan
  # ============================================================================
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code (policy-compliant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -qf FETCH_HEAD
      
      - name: Build Docker image for scanning
        run: docker build -t scan-target:latest .
      
      - name: Install Trivy CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image --severity CRITICAL,HIGH --format table --output trivy-results.txt scan-target:latest || true

      - name: Container scan summary
        if: always()
        run: |
          echo "### Container Security Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-results.txt ]; then
            tail -n 80 trivy-results.txt >> $GITHUB_STEP_SUMMARY || true
          fi

  # ============================================================================
  # Secrets Detection
  # ============================================================================
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code with history (policy-compliant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 0 origin "${GITHUB_REF_NAME}" || git fetch --depth 0 origin
          git checkout -qf FETCH_HEAD

      - name: Install Gitleaks CLI
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect --verbose --redact --report-format json --report-path gitleaks-report.json || true

  # ============================================================================
  # Security Summary
  # ============================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, static-security-analysis, container-scan, secrets-scan]
    if: always()
    
    steps:
      - name: Create security summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-security-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Detection | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
