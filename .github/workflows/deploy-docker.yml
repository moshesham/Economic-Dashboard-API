name: Deploy Docker Containers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      services:
        description: 'Services to deploy (comma-separated: api,worker,dashboard or all)'
        required: false
        default: 'all'

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code (policy-compliant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -qf FETCH_HEAD

      - name: Validate required deployment secrets
        run: |
          [ -n "${{ secrets.DEPLOY_HOST }}" ] || { echo "Missing DEPLOY_HOST"; exit 1; }
          [ -n "${{ secrets.DEPLOY_USER }}" ] || { echo "Missing DEPLOY_USER"; exit 1; }
          [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] || { echo "Missing DEPLOY_SSH_KEY"; exit 1; }

      - name: Set deployment variables
        id: vars
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          echo "services=${{ github.event.inputs.services }}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=latest" >> "$GITHUB_OUTPUT"

      - name: Deploy to remote server via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/economic-dashboard' }}
          SERVICES: ${{ steps.vars.outputs.services }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail

          cd ${DEPLOY_PATH}
          if [ "${SERVICES}" = "all" ]; then
            docker compose pull
            docker compose up -d
          else
            IFS=',' read -ra SVC_ARRAY <<< "${SERVICES}"
            for service in "${SVC_ARRAY[@]}"; do
              docker compose pull ${service}
              docker compose up -d ${service}
            done
          fi
          docker compose ps
          EOF

          scp -i ~/.ssh/deploy_key docker-compose.yml ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
          scp -i ~/.ssh/deploy_key deploy.sh ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST} "SERVICES='${SERVICES}' DEPLOY_PATH='${DEPLOY_PATH}' bash ${DEPLOY_PATH}/deploy.sh"
          rm -f ~/.ssh/deploy_key deploy.sh

      - name: Health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          API_PORT: ${{ secrets.API_PORT || '8000' }}
        run: |
          for i in {1..30}; do
            if curl -fsS "http://${DEPLOY_HOST}:${API_PORT}/health" >/dev/null; then
              echo "API health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "API health check failed"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ steps.vars.outputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Services: ${{ steps.vars.outputs.services }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ghcr.io/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
