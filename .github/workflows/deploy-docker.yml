name: Deploy Docker Containers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      services:
        description: 'Services to deploy (comma-separated: api,worker,dashboard or all)'
        required: false
        default: 'all'

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code (policy-compliant)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -qf FETCH_HEAD

      - name: Resolve deployment configuration
        id: deploy_config
        env:
          DEPLOY_HOST_SECRET: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_VAR: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER_SECRET: ${{ secrets.DEPLOY_USER }}
          DEPLOY_USER_VAR: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY_SECRET: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH_SECRET: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_VAR: ${{ vars.DEPLOY_PATH }}
          API_PORT_SECRET: ${{ secrets.API_PORT }}
          API_PORT_VAR: ${{ vars.API_PORT }}
        run: |
          set -euo pipefail

          DEPLOY_HOST="${DEPLOY_HOST_SECRET:-${DEPLOY_HOST_VAR:-}}"
          DEPLOY_USER="${DEPLOY_USER_SECRET:-${DEPLOY_USER_VAR:-}}"
          DEPLOY_SSH_KEY="${DEPLOY_SSH_KEY_SECRET:-}"
          DEPLOY_PATH="${DEPLOY_PATH_SECRET:-${DEPLOY_PATH_VAR:-/opt/economic-dashboard}}"
          API_PORT="${API_PORT_SECRET:-${API_PORT_VAR:-8000}}"

          missing=()
          [ -n "${DEPLOY_HOST}" ] || missing+=("DEPLOY_HOST (secret or variable)")
          [ -n "${DEPLOY_USER}" ] || missing+=("DEPLOY_USER (secret or variable)")
          [ -n "${DEPLOY_SSH_KEY}" ] || missing+=("DEPLOY_SSH_KEY (secret)")

          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing required deployment configuration:\n' >> "$GITHUB_STEP_SUMMARY"
            for item in "${missing[@]}"; do
              printf -- '- %s\n' "$item" >> "$GITHUB_STEP_SUMMARY"
            done
            printf 'Configure these in repository or environment settings, then re-run the workflow.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "ready=true"
            echo "deploy_host=${DEPLOY_HOST}"
            echo "deploy_user=${DEPLOY_USER}"
            echo "deploy_ssh_key<<EOF"
            echo "${DEPLOY_SSH_KEY}"
            echo "EOF"
            echo "deploy_path=${DEPLOY_PATH}"
            echo "api_port=${API_PORT}"
          } >> "$GITHUB_OUTPUT"

      - name: Set deployment variables
        id: vars
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          echo "services=${{ github.event.inputs.services }}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=latest" >> "$GITHUB_OUTPUT"

      - name: Deploy to remote server via SSH
        if: ${{ steps.deploy_config.outputs.ready == 'true' }}
        env:
          DEPLOY_HOST: ${{ steps.deploy_config.outputs.deploy_host }}
          DEPLOY_USER: ${{ steps.deploy_config.outputs.deploy_user }}
          DEPLOY_SSH_KEY: ${{ steps.deploy_config.outputs.deploy_ssh_key }}
          DEPLOY_PATH: ${{ steps.deploy_config.outputs.deploy_path }}
          SERVICES: ${{ steps.vars.outputs.services }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail

          cd ${DEPLOY_PATH}
          if [ "${SERVICES}" = "all" ]; then
            docker compose pull
            docker compose up -d
          else
            IFS=',' read -ra SVC_ARRAY <<< "${SERVICES}"
            for service in "${SVC_ARRAY[@]}"; do
              docker compose pull ${service}
              docker compose up -d ${service}
            done
          fi
          docker compose ps
          EOF

          scp -i ~/.ssh/deploy_key docker-compose.yml ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
          scp -i ~/.ssh/deploy_key deploy.sh ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST} "SERVICES='${SERVICES}' DEPLOY_PATH='${DEPLOY_PATH}' bash ${DEPLOY_PATH}/deploy.sh"
          rm -f ~/.ssh/deploy_key deploy.sh

      - name: Health check
        if: ${{ steps.deploy_config.outputs.ready == 'true' }}
        env:
          DEPLOY_HOST: ${{ steps.deploy_config.outputs.deploy_host }}
          API_PORT: ${{ steps.deploy_config.outputs.api_port }}
        run: |
          for i in {1..30}; do
            if curl -fsS "http://${DEPLOY_HOST}:${API_PORT}/health" >/dev/null; then
              echo "API health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "API health check failed"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ steps.vars.outputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Services: ${{ steps.vars.outputs.services }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ghcr.io/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy Host: ${{ steps.deploy_config.outputs.deploy_host || 'not configured' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy Path: ${{ steps.deploy_config.outputs.deploy_path || 'not configured' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
